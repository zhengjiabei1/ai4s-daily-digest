name: Daily AI News Digest

on:
  schedule:
    # Target: 10:30 AM Beijing (UTC+8). Set to UTC 22:00 (6:00 AM BJT)
    # to allow 4-5h GitHub scheduler delay — arrives between 10:00-11:00 BJT
    - cron: '0 22 * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Restore daily cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: data/
          key: daily-digest-${{ github.run_date }}

      - name: Run daily news digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: python main.py

      - name: Save daily cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/
          key: daily-digest-${{ github.run_date }}
