feishu:
  app_id: ${FEISHU_APP_ID}
  app_secret: ${FEISHU_APP_SECRET}
  chat_id: ${FEISHU_CHAT_ID}
llm:
  provider: deepseek
  api_key: ${DEEPSEEK_API_KEY}
  api_base: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  max_tokens: 8192
  temperature: 0
sources:
  rss_feeds:
  - name: Nature
    url: https://www.nature.com/nature.rss
    default_category: AI for Science
    enabled: true
    max_items: 10
    keywords:
    - artificial intelligence
    - machine learning
    - protein
    - AlphaFold
    - drug
    - materials
    - genome
    - transformer
    - language model
    - robot
  - name: MIT News
    url: https://news.mit.edu/rss/topic/artificial-intelligence2
    default_category: AI for Science
    enabled: true
    max_items: 15
    keywords:
    - AI
    - machine
    - robot
    - protein
    - drug
    - materials
    - quantum
    - learning
  - name: Meta AI Research
    url: https://research.facebook.com/feed/
    default_category: AI for Science
    enabled: true
    max_items: 10
    keywords:
    - AI
    - machine
    - language
    - vision
    - robot
    - transformer
    - LLaMA
    - generative
    - science
  - name: Google DeepMind
    url: https://deepmind.google/discover/blog/feed/
    default_category: AI for Science
    enabled: true
    max_items: 10
  - name: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/
    default_category: AI for Science
    enabled: true
    max_items: 10
    keywords:
    - AI
    - machine learning
    - deep learning
    - protein
    - drug
    - materials
    - quantum
    - language model
  - name: The Verge - AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    default_category: 通用 AI
    enabled: true
    max_items: 10
  - name: TechCrunch - AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    default_category: 通用 AI
    enabled: true
    max_items: 10
  - name: VentureBeat - AI
    url: https://venturebeat.com/category/ai/feed/
    default_category: 通用 AI
    enabled: true
    max_items: 10
  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    default_category: 通用 AI
    enabled: true
    max_items: 10
  - name: 36Kr 快讯(RSSHub)
    url: https://rsshub.rssforever.com/36kr/newsflashes
    default_category: 通用 AI
    enabled: true
    max_items: 15
    keywords:
    - AI
    - 人工智能
    - 大模型
    - GPT
    - OpenAI
    - DeepSeek
    - 融资
    - 芯片
    - 算力
    - 机器
  - name: GitHub Trending(RSSHub)
    url: https://rsshub.rssforever.com/github/trending/daily/python
    default_category: 通用 AI
    enabled: true
    max_items: 10
    keywords:
    - llm
    - gpt
    - agent
    - rag
    - langchain
    - transformer
    - diffusion
    - llama
    - deepseek
    - openai
    - anthropic
    - mcp
    - chatgpt
    - claude
    - qwen
  - name: AP News AI(RSSHub)
    url: https://rsshub.rssforever.com/apnews/topics/artificial-intelligence
    default_category: 通用 AI
    enabled: true
    max_items: 10
  aisi:
    enabled: false
    max_items: 15
  baai:
    enabled: false
    max_items: 10
  scrapers:
  - name: DeepModeling 社区博客 (AISI)
    url: https://deepmodeling.com/blog
    default_category: AI for Science
    article_selector: a.post-title-link
    base_url: https://deepmodeling.com
    max_items: 10
    enabled: true
  - name: 上海 AI 实验室 (浦江)
    url: https://www.shlab.org.cn/info
    default_category: AI for Science
    article_selector: a[href*="/news/"]
    base_url: https://www.shlab.org.cn
    max_items: 10
    enabled: true
  - name: 深势科技
    url: https://www.dp.tech/publish
    default_category: AI for Science
    article_selector: a[href*="mp.weixin.qq.com"]
    base_url: https://www.dp.tech
    max_items: 10
    enabled: true
  arxiv:
    enabled: true
    categories:
    - cs.AI
    - cs.CL
    - cs.LG
    - cs.CV
    - q-bio.BM
    - physics.chem-ph
    - cond-mat.mtrl-sci
    max_results: 100
    lookback_days: 7
  hacker_news:
    enabled: false
  github_trending:
    enabled: false
  aihot:
    enabled: true
    max_items: 20
processing:
  dedup_threshold: 85
  max_articles_for_primary_card: 6
  batch_size_for_llm: 10
  min_score: 1
logging:
  level: INFO
  log_dir: logs/
  retention_days: 30
