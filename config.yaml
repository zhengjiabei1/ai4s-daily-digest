# ====== Feishu (Lark) Bot Credentials ======
feishu:
  app_id: "${FEISHU_APP_ID}"
  app_secret: "${FEISHU_APP_SECRET}"
  chat_id: "${FEISHU_CHAT_ID}"

# ====== LLM API (supports OpenAI-compatible providers) ======
llm:
  provider: "deepseek"             # deepseek | openai | zhipu | moonshot | qwen | anthropic
  api_key: "${DEEPSEEK_API_KEY}"
  api_base: "https://api.deepseek.com/v1"
  model: "deepseek-v4-flash"       # deepseek-v4-flash (fast/cheap) or deepseek-v4-pro
  max_tokens: 8192
  temperature: 0

# ====== News Sources ======
sources:
  rss_feeds:
    # ── AI4S / 科研来源 ──
    - name: "Nature"
      url: "https://www.nature.com/nature.rss"
      default_category: "科研论文"
      enabled: true
      keywords: ["artificial intelligence", "machine learning", "deep learning", "neural", "protein", "AlphaFold", "drug", "materials", "genome", "transformer", "language model", "reinforcement", "robot", "LLM"]
    - name: "MIT News - AI"
      url: "https://news.mit.edu/rss/topic/artificial-intelligence2"
      default_category: "科研论文"
      enabled: true
      keywords: ["AI", "model", "neural", "robot", "protein", "drug", "materials", "quantum", "data", "learning"]
    - name: "Quanta Magazine"
      url: "https://www.quantamagazine.org/feed/"
      default_category: "科研论文"
      enabled: true
      keywords: ["AI", "machine learning", "neural", "protein", "quantum", "mathematics", "biology", "physics", "computer", "algorithm"]
    - name: "DeepMind Blog"
      url: "https://deepmind.google/discover/blog/feed/"
      default_category: "科研论文"
      enabled: true
    - name: "Microsoft Research"
      url: "https://www.microsoft.com/en-us/research/feed/"
      default_category: "科研论文"
      enabled: true
      keywords: ["AI", "machine learning", "deep learning", "protein", "drug", "materials", "quantum", "language model", "transformer"]
    - name: "New Scientist - AI"
      url: "https://www.newscientist.com/subject/artificial-intelligence/feed/"
      default_category: "科研论文"
      enabled: true
    - name: "MIT Tech Review"
      url: "https://www.technologyreview.com/feed/"
      default_category: "科研论文"
      enabled: true
      keywords: ["AI", "artificial intelligence", "machine learning", "deep learning", "neural", "robot", "biotech", "materials", "climate"]
    - name: "MarkTechPost"
      url: "https://www.marktechpost.com/feed/"
      default_category: "科研论文"
      enabled: true
      keywords: ["AI", "LLM", "research", "paper", "deep", "transformer", "diffusion", "protein", "drug", "model"]
    # ── 通用 AI / 行业动态来源 ──
    - name: "The Verge - AI"
      url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
      default_category: "行业动态"
      enabled: true
    - name: "TechCrunch - AI"
      url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      default_category: "行业动态"
      enabled: true
    - name: "VentureBeat - AI"
      url: "https://venturebeat.com/category/ai/feed/"
      default_category: "行业动态"
      enabled: true
    # ── 中文来源 ──
    - name: "机器之心"
      url: "https://www.jiqizhixin.com/rss"
      default_category: "行业动态"
      enabled: true
    - name: "量子位"
      url: "https://www.qbitai.com/feed"
      default_category: "行业动态"
      enabled: true
    - name: "36Kr"
      url: "https://36kr.com/feed"
      default_category: "融资收购"
      enabled: true
      keywords: ["AI", "大模型", "LLM", "GPT", "ChatGPT", "OpenAI", "Claude", "DeepSeek", "千问", "豆包", "文心", "智谱", "字节", "阿里", "华为", "腾讯", "百度", "NVIDIA", "科学智能", "AISI", "深势", "智源", "蛋白质", "药物", "材料", "清华", "北大", "浙大", "Stanford", "MIT", "DeepMind", "融资", "收购"]

  hacker_news:
    enabled: false  # HN too slow for real-time pipeline
    max_stories: 50
    keywords:
      - "OpenAI"
      - "ChatGPT"
      - "GPT"
      - "Claude"
      - "Anthropic"
      - "DeepSeek"
      - "Gemini"
      - "DeepMind"
      - "AlphaFold"
      - "LLM"
      - "LLaMA"
      - "Qwen"
      - "Mistral"
      - "language model"
      - "transformer"
      - "agent"
      - "protein"
      - "drug"
      - "materials"
      - "genomics"
      - "quantum"
      - "NVIDIA"
      - "GPU"
      - "Nature"
      - "Science"
      - "MIT"
      - "Stanford"
      - "CMU"
      - "Berkeley"
      - "Microsoft"
      - "Google"
      - "Meta"

  arxiv:
    enabled: false
  github_trending:
    enabled: false

# ====== Processing ======
processing:
  dedup_threshold: 85
  max_articles_for_primary_card: 8
  batch_size_for_llm: 10
  min_score: 1   # no strict filter — let diversity selector pick best per category

# ====== Logging ======
logging:
  level: "INFO"
  log_dir: "logs/"
  retention_days: 30
