feishu:
  app_id: ${FEISHU_APP_ID}
  app_secret: ${FEISHU_APP_SECRET}
  chat_id: ${FEISHU_CHAT_ID}
llm:
  provider: deepseek
  api_key: ${DEEPSEEK_API_KEY}
  api_base: https://api.deepseek.com/v1
  model: deepseek-v4-flash
  max_tokens: 8192
  temperature: 0
sources:
  rss_feeds:
  - name: Google DeepMind
    url: https://deepmind.google/discover/blog/feed/
    default_category: AI for Science
    enabled: true
    max_items: 10
  - name: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/
    default_category: AI for Science
    enabled: true
    max_items: 10
    keywords:
    - AI
    - machine learning
    - deep learning
    - protein
    - drug
    - materials
    - quantum
    - language model
  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    default_category: 通用 AI
    enabled: true
    max_items: 10
  baai:
    enabled: true
    max_items: 10
  scrapers:
  - name: DeepModeling 社区博客 (AISI)
    url: https://deepmodeling.com/blog
    default_category: AI for Science
    article_selector: a.post-title-link
    base_url: https://deepmodeling.com
    max_items: 10
    enabled: true
  - name: 上海 AI 实验室 (浦江)
    url: https://www.shlab.org.cn/info
    default_category: AI for Science
    article_selector: a[href*="/news/"]
    base_url: https://www.shlab.org.cn
    max_items: 10
    enabled: true
  - name: 深势科技
    url: https://www.dp.tech/publish
    default_category: AI for Science
    article_selector: a[href*="mp.weixin.qq.com"]
    base_url: https://www.dp.tech
    max_items: 10
    enabled: true
  arxiv:
    enabled: false
  hacker_news:
    enabled: false
  github_trending:
    enabled: false
processing:
  dedup_threshold: 85
  max_articles_for_primary_card: 8
  batch_size_for_llm: 10
  min_score: 1
logging:
  level: INFO
  log_dir: logs/
  retention_days: 30
